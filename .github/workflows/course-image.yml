name: Validate and publish course image

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated multi-platform image to GHCR
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  validate:
    name: Validate ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build local validation image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          load: true
          platforms: ${{ matrix.platform }}
          tags: course-image:validation
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=course-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=course-image-${{ matrix.arch }}

      - name: Run the complete container contract
        env:
          COURSE_IMAGE: course-image:validation
        run: scripts/course-container .devcontainer/verify-image

  publish-platform:
    name: Publish ${{ matrix.arch }}
    needs: validate
    if: inputs.publish && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish validated platform image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}-${{ matrix.arch }}
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=course-image-${{ matrix.arch }}
          provenance: mode=max
          sbom: true

  publish-manifest:
    name: Publish multi-platform manifest
    needs: publish-platform
    if: inputs.publish && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create immutable and convenience tags
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:sha-${GITHUB_SHA}" \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}:sha-${GITHUB_SHA}-amd64" \
            "${IMAGE_NAME}:sha-${GITHUB_SHA}-arm64"
          docker buildx imagetools inspect "${IMAGE_NAME}:sha-${GITHUB_SHA}"
